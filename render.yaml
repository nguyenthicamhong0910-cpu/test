services:
  - type: web
    name: ccb-tay-ninh-app
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ccb-tay-ninh-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
databases:
  - name: ccb-tay-ninh-db
    plan: basic-256mb
    databaseName: ccb_tay_ninh
    user: ccb_app
